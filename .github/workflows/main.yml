name: Build Android Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex git gnupg gperf libncurses5-dev \
          libssl-dev libxml2-utils lzop openjdk-11-jdk python3 python3-pip \
          unzip zip zlib1g-dev

    # --- SSH Debug Step ---
    - name: Force Start Tmate Manually
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update && sudo apt-get install -y tmate
        
        echo "Starting tmate daemon..."
        tmate -F &
        
        echo "Waiting for SSH keys to generate..."
        for i in {1..10}; do
          sleep 2
          if sudo tmate display -p '#{tmate_ssh}'; then
            echo "--------------------------------------------------------"
            echo "YOUR SSH COMMAND:"
            sudo tmate display -p '#{tmate_ssh}'
            echo "YOUR WEB URL:"
            sudo tmate display -p '#{tmate_web}'
            echo "--------------------------------------------------------"
            break
          fi
        done
        
        # Keep the runner alive so you can use the connection
        while [ ! -f /tmp/keepalive ]; do
          sleep 5
        done
        
