name: Build Android Kernel SukiSU

on:
  pull_request:
    branches: [ "a32x-kernel" ]
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the kernel repository into the workspace root
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      # Step 2: Install required packages for compilation
      # Android kernels need quite a few host packages to compile successfully.
      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib \
            gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libncurses6

      # Step 3: Run your custom build script
      # This will run build.sh located in the root of your checked-out repository.
      - name: Execute Kernel Build Script
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs_new
          chmod +x build.sh
          ./build.sh

      # Step 4: Upload the compiled kernel artifact
      # This grabs everything from the output/ folder and makes it a downloadable zip.
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-android-kernel
          path: output/
          if-no-files-found: error # Fails the workflow if output/ is empty (meaning the build failed)
          
